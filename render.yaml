services:
  - type: web
    name: credit-iq-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.backend
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPLOADS_DIR
        value: /tmp/uploads
      - key: CORS_ORIGINS
        sync: false